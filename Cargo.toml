[package]
name = "game-engine"
version = "0.1.0"
edition = "2021"

[features]
default = []
test-helpers = ["openh264", "mp4"]

[dependencies]
wgpu = "0.19"
winit = "0.29"
glam = { version = "0.25", features = ["serde", "bytemuck"] }
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
pollster = "0.3"
env_logger = "0.10"
log = "0.4"
bytemuck = { version = "1.14", features = ["derive"] }
image = "0.24"
openh264 = { version = "0.6", optional = true }
mp4 = { version = "0.14", optional = true }

[[bin]]
name = "client"
path = "src/bin/client.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[lib]
name = "game_engine"
path = "src/lib.rs"

[dev-dependencies]
# No additional dev dependencies needed - video encoding deps are optional features
