[package]
name = "game-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu = "0.19"
winit = "0.29"
glam = "0.25"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
pollster = "0.3"
env_logger = "0.10"
log = "0.4"

[[bin]]
name = "client"
path = "src/bin/client.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[lib]
name = "game_engine"
path = "src/lib.rs"
